plugins {
    id 'application'
    id 'com.github.spotbugs'
    id 'jacoco'
}
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    implementation project(':core')
    implementation 'com.google.code.gson:gson:2.14.0'
    runtimeOnly 'org.postgresql:postgresql:42.7.14'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application {
    mainClass = 'br.com.colheitafeliz.server.ServerMain'
    applicationDefaultJvmArgs = ['-Xms32m', '-Xmx192m', '-XX:MaxMetaspaceSize=96m', '-XX:ActiveProcessorCount=2',
        '-Djdk.httpserver.maxConnections=48', '-Dsun.net.httpserver.maxReqHeaders=32', '-Dsun.net.httpserver.maxReqHeaderSize=16384',
        '-Dsun.net.httpserver.maxReqTime=10', '-Dsun.net.httpserver.maxRspTime=20']
}
tasks.test { useJUnitPlatform { excludeTags 'integration' }; finalizedBy tasks.jacocoTestReport }
tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Tests transactions against disposable PostgreSQL; requires TEST_DATABASE_URL.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    shouldRunAfter tasks.test
    finalizedBy tasks.jacocoTestReport
}
jacoco { toolVersion = '0.8.12' }
tasks.jacocoTestReport {
    executionData fileTree(layout.buildDirectory.dir('jacoco')) { include '*.exec' }
    mustRunAfter tasks.named('integrationTest')
    reports { xml.required = true; html.required = true }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}
spotbugs {
    toolVersion = '4.8.6'
    effort = 'max'
    reportLevel = 'medium'
    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
}
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports.create('xml') { required = true }
    reports.create('html') { required = true }
}
