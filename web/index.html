<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#376b36"><title>Colheita Feliz</title><link rel="stylesheet" href="/style.css"><script src="/config.js" defer></script><script src="/app.js" defer></script></head>
<body>
 <main id="app">
  <div id="welcome"><h1>Colheita Feliz</h1><p>Sua fazenda, seus amigos, uma colheita por vez.</p><div id="login"></div></div>
  <section id="game" hidden aria-label="Fazenda">
   <canvas id="farm" aria-label="Fazenda. Use Ajustes e Lista de terras para jogar pelo teclado."></canvas>
   <header><div id="wallet" class="panel"></div><nav id="farm-menu" aria-label="Menu da fazenda">
    <button id="shop" class="farm-menu-button"><img src="/assets/classic/icons/icon-shop.png" alt=""><span>Loja</span></button>
    <button id="deposit" class="farm-menu-button"><img src="/assets/classic/icons/deposit-icon.png" alt=""><span>Depósito</span></button>
    <button id="missions" class="farm-menu-button"><img src="/assets/classic/icons/xp.png" alt=""><span>Tarefas</span></button>
    <button id="friends" class="farm-menu-button"><img src="/assets/classic/icons/avatar_masculino.png" alt=""><span>Amigos</span></button>
    <button id="home" class="farm-menu-button" hidden><img src="/assets/classic/icons/icone-minha-fazenda.png" alt=""><span>Minha fazenda</span></button>
    <button id="settings" class="farm-menu-button" aria-label="Ajustes"><span class="settings-icon" aria-hidden="true">⚙</span><span>Ajustes</span></button>
   </nav></header>
   <aside id="tutorial" class="panel"></aside>
   <div id="plant-health" class="panel crop-tooltip" role="tooltip" hidden></div>
   <div id="tool-tray" class="tool-tray" role="group" aria-label="Seleção da ferramenta" hidden></div>
   <footer><div id="tools" role="toolbar" aria-label="Ferramentas"></div></footer>
  </section>
  <div id="connection" class="panel" role="status" hidden></div>
  <div id="pending" class="panel" hidden><span>Uma ação aguarda confirmação.</span><button id="retry">Confirmar ação pendente</button></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="dialog-header"><h2 id="modal-title"></h2><button id="close-modal" aria-label="Fechar">×</button></div><div id="modal-content"></div></dialog>
 </main>
</body></html>
