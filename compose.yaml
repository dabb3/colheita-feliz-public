services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: colheita_local
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - colheita_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d colheita_local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  colheita_local_data:
