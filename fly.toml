# Preparação apenas: criar/deployar recursos exige aprovação de orçamento.
# Aplicação existente. Deploy futuro: fly deploy --ha=false; conferir uma máquina.
app = "colheita-feliz-public"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  AUTH_MODE = "production"
  PORT = "8080"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[files]]
  guest_path = "/etc/secrets/root.crt"
  secret_name = "SUPABASE_CA_CERT"
