name: CI and desktop release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: colheita_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d colheita_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55439/colheita_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify web client
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build:local

      - name: Install Chromium and WebKit for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium webkit

      - name: Start synthetic development API
        env:
          AUTH_MODE: development
          HOST: 127.0.0.1
          DATABASE_URL: jdbc:postgresql://127.0.0.1:55439/colheita_test
          DATABASE_USER: postgres
          ALLOWED_ORIGINS: http://127.0.0.1:5173
        run: |
          nohup bash ./gradlew --no-daemon :server:run > "$RUNNER_TEMP/colheita-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/colheita-api.pid"
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/colheita-api.log"
          exit 1

      - name: Run Chromium, WebKit desktop and iPhone WebKit E2E
        working-directory: web
        run: npm run test:e2e

      - name: Stop synthetic development API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/colheita-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/colheita-api.pid")" 2>/dev/null || true
          fi

      - name: Verify Fly deploy guards without network or credentials
        run: bash .github/scripts/test-deploy-fly.sh

      - name: Save web preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: colheita-web-local-preview
          path: web/dist/
          retention-days: 7

      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-playwright-evidence
          path: |
            web/test-results/
            web/playwright-report/
            ${{ runner.temp }}/colheita-api.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and run checks
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH, for example v0.2.0."
              exit 1
            fi
            bash ./gradlew --no-daemon "-PreleaseVersion=$release_version" build :server:integrationTest distZip
          else
            bash ./gradlew --no-daemon build :server:integrationTest distZip
          fi

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spotbugs-report
          path: |
            build/reports/spotbugs/main.xml
            build/reports/spotbugs/main.html
            build/reports/spotbugs/test.xml
            build/reports/spotbugs/test.html
            core/build/reports/spotbugs/
            server/build/reports/spotbugs/
          retention-days: 7

      - name: Convert SpotBugs XML to SARIF
        if: github.event_name == 'pull_request' && always()
        shell: bash
        run: |
          convert_to_sarif() {
            local xml="$1" sarif="$2" prefix="$3"
            [ -f "$xml" ] || return 0
            python3 - "$xml" "$sarif" "$prefix" <<'PYEOF'
          import json, sys, xml.etree.ElementTree as ET
          xml_path, sarif_path, prefix = sys.argv[1], sys.argv[2], sys.argv[3]
          tree = ET.parse(xml_path)
          root = tree.getroot()
          results = []
          for bug in root.findall('.//BugInstance'):
            src = bug.find('.//SourceLine')
            line = int(src.get('start', '0')) if src is not None else 1
            path = src.get('sourcepath', '') if src is not None else ''
            if path and prefix:
              path = prefix + path
            results.append({
              'ruleId': bug.get('type'),
              'level': 'warning',
              'message': {'text': (bug.findtext('ShortMessage') or '').strip()},
              'locations': [{'physicalLocation': {
                'artifactLocation': {'uri': path},
                'region': {'startLine': max(line, 1)}
              }}]
            })
          sarif_doc = {
            'version': '2.1.0',
            '$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
            'runs': [{'tool': {'driver': {'name': 'SpotBugs'}}, 'results': results}]
          }
          with open(sarif_path, 'w') as f:
            json.dump(sarif_doc, f)
          print(f'Converted {xml_path} -> {sarif_path} ({len(results)} findings)')
          PYEOF
          }
          convert_to_sarif build/reports/spotbugs/main.xml build/reports/spotbugs/main.sarif "src/main/java/"
          convert_to_sarif build/reports/spotbugs/test.xml build/reports/spotbugs/test.sarif "src/test/java/"
          convert_to_sarif core/build/reports/spotbugs/main.xml core/build/reports/spotbugs/main.sarif "src/main/java/"
          convert_to_sarif core/build/reports/spotbugs/test.xml core/build/reports/spotbugs/test.sarif "core/src/test/java/"

          convert_to_sarif server/build/reports/spotbugs/main.xml server/build/reports/spotbugs/main.sarif "server/src/main/java/"
          convert_to_sarif server/build/reports/spotbugs/test.xml server/build/reports/spotbugs/test.sarif "server/src/test/java/"

      - name: Upload Server SpotBugs SARIF to PR
        if: github.event_name == 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: server/build/reports/spotbugs/main.sarif
          category: spotbugs-server-main

      - name: Upload Server Test SpotBugs SARIF to PR
        if: github.event_name == 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: server/build/reports/spotbugs/test.sarif
          category: spotbugs-server-test

      - name: Upload Core SpotBugs SARIF to PR
        if: github.event_name == 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: core/build/reports/spotbugs/main.sarif
          category: spotbugs-core-main

      - name: Upload Core Test SpotBugs SARIF to PR
        if: github.event_name == 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: core/build/reports/spotbugs/test.sarif
          category: spotbugs-core-test

      - name: Upload SpotBugs SARIF to PR
        if: github.event_name == 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: build/reports/spotbugs/main.sarif
          category: spotbugs-main

      - name: Upload SpotBugs Test SARIF to PR
        if: github.event_name == 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: build/reports/spotbugs/test.sarif
          category: spotbugs-test

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/test/
            server/build/reports/jacoco/
            server/build/reports/tests/
          retention-days: 7

      - name: Save desktop distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: colheita-feliz-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 7

  safari-ios:
    name: Safari iOS Simulator
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Install web dependencies and build local client
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build:local

      - name: Validate Xcode and available iPhone simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          node web/e2e/safari-simulator.mjs --list

      - name: Start disposable PostgreSQL 17
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install postgresql@17
          pg_bin="$(brew --prefix postgresql@17)/bin"
          pg_data="$RUNNER_TEMP/colheita-postgres"
          "$pg_bin/initdb" -D "$pg_data" --username=postgres --auth=trust --encoding=UTF8 --no-locale
          "$pg_bin/pg_ctl" -D "$pg_data" -l "$RUNNER_TEMP/postgres.log" -o "-h 127.0.0.1 -p 55439" start
          "$pg_bin/createdb" -h 127.0.0.1 -p 55439 -U postgres colheita_test

      - name: Run Safari simulator flow with isolated development API
        env:
          AUTH_MODE: development
          HOST: 127.0.0.1
          DATABASE_URL: jdbc:postgresql://127.0.0.1:55439/colheita_test
          DATABASE_USER: postgres
          ALLOWED_ORIGINS: http://127.0.0.1:5173
          E2E_APP_URL: http://127.0.0.1:5173
          SAFARI_ARTIFACT_DIR: web/test-results/safari-simulator
        run: |
          set -Eeuo pipefail
          mkdir -p web/test-results/safari-simulator
          api_pid=
          web_pid=
          appium_pid=
          cleanup() {
            [ -z "$appium_pid" ] || kill "$appium_pid" 2>/dev/null || true
            [ -z "$web_pid" ] || kill "$web_pid" 2>/dev/null || true
            [ -z "$api_pid" ] || kill "$api_pid" 2>/dev/null || true
            [ -z "$appium_pid" ] || wait "$appium_pid" 2>/dev/null || true
            [ -z "$web_pid" ] || wait "$web_pid" 2>/dev/null || true
            [ -z "$api_pid" ] || wait "$api_pid" 2>/dev/null || true
            cp "$RUNNER_TEMP/colheita-api.log" web/test-results/safari-simulator/api.log 2>/dev/null || true
            cp "$RUNNER_TEMP/postgres.log" web/test-results/safari-simulator/postgres.log 2>/dev/null || true
            "$(brew --prefix postgresql@17)/bin/pg_ctl" -D "$RUNNER_TEMP/colheita-postgres" stop 2>/dev/null || true
          }
          trap cleanup EXIT
          bash ./gradlew --no-daemon :server:run > "$RUNNER_TEMP/colheita-api.log" 2>&1 &
          api_pid=$!
          npm run serve --prefix web > web/test-results/safari-simulator/web.log 2>&1 &
          web_pid=$!
          npx --yes appium@2.19.0 driver install xcuitest@9.10.5
          npx --yes appium@2.19.0 --address 127.0.0.1 --port 4723 > web/test-results/safari-simulator/appium.log 2>&1 &
          appium_pid=$!
          ready=0
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null && curl --fail --silent http://127.0.0.1:5173/ >/dev/null && curl --fail --silent http://127.0.0.1:4723/status >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/colheita-api.log" web/test-results/safari-simulator/web.log web/test-results/safari-simulator/appium.log
            exit 1
          fi
          node web/e2e/safari-simulator.mjs

      - name: Save Safari simulator logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: safari-ios-simulator-evidence
          path: web/test-results/safari-simulator/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy API to Fly.io
    needs: [build, safari-ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/online-core-compartilhado'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fly-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24 for health validation
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Set up the verified flyctl version
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # commit pin (no tag)
        with:
          version: '0.5.1'

      - name: Deploy current production commit and check API health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bash .github/scripts/deploy-fly.sh

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download desktop distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: colheita-feliz-distribution
          path: release-assets

      - name: Create SHA-256 checksums
        run: sha256sum release-assets/*.zip > release-assets/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/SHA256SUMS --generate-notes
