name: CI and desktop release

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and run checks
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH, for example v0.2.0."
              exit 1
            fi
            bash ./gradlew --no-daemon "-PreleaseVersion=$release_version" build distZip
          else
            bash ./gradlew --no-daemon build distZip
          fi

      - name: Run SpotBugs
        run: bash ./gradlew --no-daemon spotbugsMain

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/main/
          retention-days: 7

      - name: Publish SpotBugs to PR
        if: github.event_name == 'pull_request' && always()
        uses: jwgmelink/spotbugs-report-action@v1
        with:
          path: build/reports/spotbugs/main.xml

      - name: Publish SpotBugs Test to PR
        if: github.event_name == 'pull_request' && always()
        uses: jwgmelink/spotbugs-report-action@v1
        with:
          path: build/reports/spotbugs/test.xml

      - name: Run JaCoCo coverage
        run: bash ./gradlew --no-daemon jacocoTestReport

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 7

      - name: Save desktop distribution
        uses: actions/upload-artifact@v7
        with:
          name: colheita-feliz-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download desktop distribution
        uses: actions/download-artifact@v8
        with:
          name: colheita-feliz-distribution
          path: release-assets

      - name: Create SHA-256 checksums
        run: sha256sum release-assets/*.zip > release-assets/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/SHA256SUMS --generate-notes
