name: CI and desktop release

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and run checks
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH, for example v0.2.0."
              exit 1
            fi
            bash ./gradlew --no-daemon "-PreleaseVersion=$release_version" build distZip
          else
            bash ./gradlew --no-daemon build distZip
          fi

      - name: Run SpotBugs
        run: bash ./gradlew --no-daemon spotbugsMain

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/main/
          retention-days: 7

      - name: Convert SpotBugs XML to SARIF
        if: github.event_name == 'pull_request' && always()
        shell: bash
        run: |
          pip install --quiet spotbugs-to-sarif 2>/dev/null || true
          for report in main test; do
            xml="build/reports/spotbugs/${report}.xml"
            sarif="build/reports/spotbugs/${report}.sarif"
            if [ -f "$xml" ]; then
              python3 -c "
          import json, sys, xml.etree.ElementTree as ET
          tree = ET.parse('$xml')
          root = tree.getroot()
          results = []
          for bug in root.findall('.//BugInstance'):
            src = bug.find('.//SourceLine')
            line = int(src.get('start', '0')) if src is not None else 1
            path = src.get('sourcepath', '') if src is not None else ''
            results.append({
              'ruleId': bug.get('type'),
              'level': 'warning',
              'message': {'text': (bug.findtext('ShortMessage') or '').strip()},
              'locations': [{'physicalLocation': {
                'artifactLocation': {'uri': path},
                'region': {'startLine': max(line, 1)}
              }}]
            })
          sarif = {'version': '2.1.0', '$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
                   'runs': [{'tool': {'driver': {'name': 'SpotBugs'}}, 'results': results}]}
          with open('$sarif', 'w') as f:
            json.dump(sarif, f)
          print(f'Converted $xml -> $sarif ({len(results)} findings)')
              " || echo "WARN: failed to convert $xml"
            fi
          done

      - name: Upload SpotBugs SARIF to PR
        if: github.event_name == 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/spotbugs/main.sarif
          category: spotbugs-main

      - name: Upload SpotBugs Test SARIF to PR
        if: github.event_name == 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/spotbugs/test.sarif
          category: spotbugs-test

      - name: Run JaCoCo coverage
        run: bash ./gradlew --no-daemon jacocoTestReport

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 7

      - name: Save desktop distribution
        uses: actions/upload-artifact@v7
        with:
          name: colheita-feliz-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download desktop distribution
        uses: actions/download-artifact@v8
        with:
          name: colheita-feliz-distribution
          path: release-assets

      - name: Create SHA-256 checksums
        run: sha256sum release-assets/*.zip > release-assets/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/SHA256SUMS --generate-notes
